name: Deploy to GitHub Pages

# Publishes the site by syncing main into the gh-pages branch, which GitHub
# Pages serves. (The gh-pages route works without touching repo settings.)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push site to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B gh-pages
          # Stamp asset URLs with the commit so browsers fetch fresh JS/CSS
          # after every deploy instead of serving 10-minute-stale caches.
          sed -i "s/__BUILD__/${GITHUB_SHA::8}/g" index.html
          git commit -am "Stamp build ${GITHUB_SHA::8}"
          git push -f origin gh-pages
